<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" data-asset-id="character-paladin" data-layer="character" data-tags="paladin,holy knight,圣骑士,圣武士" data-origin="center-bottom">
  <!-- Legs -->
  <rect x="44" y="105" width="14" height="35" rx="3" fill="#c0c0d0"/>
  <rect x="62" y="105" width="14" height="35" rx="3" fill="#c0c0d0"/>
  <!-- Greaves -->
  <rect x="42" y="120" width="18" height="22" rx="3" fill="#b0b0c0"/>
  <rect x="60" y="120" width="18" height="22" rx="3" fill="#b0b0c0"/>
  <!-- Boots -->
  <rect x="42" y="135" width="18" height="10" rx="3" fill="#a0a0b0"/>
  <rect x="60" y="135" width="18" height="10" rx="3" fill="#a0a0b0"/>
  <!-- Body (white/gold armor) -->
  <rect x="40" y="55" width="40" height="50" rx="5" fill="#c0c0d0"/>
  <rect x="43" y="58" width="34" height="44" rx="3" fill="#d0d0e0"/>
  <!-- Holy symbol on chest -->
  <circle cx="60" cy="75" r="8" fill="#d4aa43"/>
  <rect x="58" y="69" width="4" height="16" rx="1" fill="#f0f0ff"/>
  <rect x="54" y="73" width="12" height="4" rx="1" fill="#f0f0ff"/>
  <!-- Belt -->
  <rect x="40" y="92" width="40" height="6" rx="2" fill="#d4aa43"/>
  <!-- Arms -->
  <rect x="28" y="60" width="12" height="40" rx="4" fill="#c0c0d0"/>
  <rect x="80" y="60" width="12" height="40" rx="4" fill="#c0c0d0"/>
  <!-- Pauldrons -->
  <rect x="26" y="55" width="16" height="10" rx="4" fill="#d4aa43"/>
  <rect x="78" y="55" width="16" height="10" rx="4" fill="#d4aa43"/>
  <!-- Holy sword -->
  <rect x="92" y="35" width="4" height="60" rx="1" fill="#f0f0ff"/>
  <rect x="88" y="52" width="12" height="4" rx="1" fill="#d4aa43"/>
  <rect x="91" y="93" width="6" height="10" rx="2" fill="#d4aa43"/>
  <!-- Halo -->
  <ellipse cx="60" cy="12" rx="18" ry="4" fill="none" stroke="#d4aa43" stroke-width="2" opacity="0.7"/>
  <!-- Head -->
  <ellipse cx="60" cy="35" rx="20" ry="22" fill="#c0c0d0"/>
  <!-- Helmet -->
  <rect x="45" y="22" width="30" height="20" rx="5" fill="#c0c0d0"/>
  <rect x="50" y="30" width="20" height="8" rx="2" fill="#2a2a3a"/>
  <!-- Cross on helm -->
  <rect x="58" y="15" width="4" height="12" rx="1" fill="#d4aa43"/>
  <rect x="54" y="19" width="12" height="4" rx="1" fill="#d4aa43"/>
</svg>