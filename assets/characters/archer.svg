<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" data-asset-id="character-archer" data-layer="character" data-tags="archer,bowman,弓箭手,射手" data-origin="center-bottom">
  <!-- Legs -->
  <rect x="44" y="105" width="14" height="35" rx="3" fill="#4a4a5a"/>
  <rect x="62" y="105" width="14" height="35" rx="3" fill="#4a4a5a"/>
  <!-- Boots -->
  <rect x="42" y="132" width="18" height="10" rx="3" fill="#3a3a2a"/>
  <rect x="60" y="132" width="18" height="10" rx="3" fill="#3a3a2a"/>
  <!-- Body -->
  <rect x="40" y="55" width="40" height="50" rx="5" fill="#4a6a3a"/>
  <!-- Belt -->
  <rect x="40" y="90" width="40" height="6" rx="2" fill="#5a4a3a"/>
  <rect x="55" y="89" width="10" height="8" rx="2" fill="#8a8a9a"/>
  <!-- Left Arm -->
  <rect x="28" y="60" width="12" height="40" rx="4" fill="#4a6a3a"/>
  <!-- Right Arm (drawn back) -->
  <rect x="80" y="58" width="12" height="38" rx="4" fill="#4a6a3a"/>
  <!-- Bow -->
  <path d="M18 45 Q10 80 18 115" stroke="#6a5a3a" stroke-width="3" fill="none"/>
  <line x1="18" y1="45" x2="18" y2="115" stroke="#8a8a7a" stroke-width="1"/>
  <!-- Arrow -->
  <line x1="18" y1="80" x2="90" y2="75" stroke="#8a7a5a" stroke-width="2"/>
  <polygon points="90,75 85,72 85,78" fill="#8a8a9a"/>
  <!-- Quiver -->
  <rect x="30" y="55" width="8" height="30" rx="2" fill="#5a4a3a"/>
  <!-- Head -->
  <ellipse cx="60" cy="35" rx="20" ry="22" fill="#d4a843"/>
  <!-- Hood -->
  <path d="M40 30 Q60 5 80 30 L80 20 Q60 0 40 20 Z" fill="#4a5a3a"/>
  <!-- Eyes -->
  <ellipse cx="53" cy="32" rx="3" ry="3" fill="#2a2a2a"/>
  <ellipse cx="67" cy="32" rx="3" ry="3" fill="#2a2a2a"/>
</svg>