<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" data-asset-id="character-samurai" data-layer="character" data-tags="samurai,warrior,武士,侍" data-origin="center-bottom">
  <!-- Legs -->
  <rect x="44" y="105" width="14" height="35" rx="3" fill="#d0d0e0"/>
  <rect x="62" y="105" width="14" height="35" rx="3" fill="#d0d0e0"/>
  <!-- Sandals -->
  <rect x="42" y="135" width="18" height="8" rx="2" fill="#6a5a3a"/>
  <rect x="60" y="135" width="18" height="8" rx="2" fill="#6a5a3a"/>
  <!-- Body (armor) -->
  <rect x="40" y="55" width="40" height="50" rx="5" fill="#5a3a3a"/>
  <!-- Chest plate -->
  <rect x="43" y="58" width="34" height="30" rx="3" fill="#8a8a9a"/>
  <!-- Lacing -->
  <line x1="50" y1="60" x2="50" y2="85" stroke="#d0d0e0" stroke-width="1.5"/>
  <line x1="60" y1="60" x2="60" y2="85" stroke="#d0d0e0" stroke-width="1.5"/>
  <line x1="70" y1="60" x2="70" y2="85" stroke="#d0d0e0" stroke-width="1.5"/>
  <!-- Skirt armor -->
  <path d="M40 88 L38 105 L82 105 L80 88 Z" fill="#5a3a3a"/>
  <line x1="50" y1="88" x2="48" y2="105" stroke="#8a8a9a" stroke-width="1.5"/>
  <line x1="60" y1="88" x2="60" y2="105" stroke="#8a8a9a" stroke-width="1.5"/>
  <line x1="70" y1="88" x2="72" y2="105" stroke="#8a8a9a" stroke-width="1.5"/>
  <!-- Belt/Obi -->
  <rect x="40" y="85" width="40" height="8" rx="2" fill="#d4aa43"/>
  <!-- Arms -->
  <rect x="28" y="60" width="12" height="38" rx="4" fill="#5a3a3a"/>
  <rect x="80" y="60" width="12" height="38" rx="4" fill="#5a3a3a"/>
  <!-- Shoulder guards -->
  <rect x="24" y="52" width="18" height="12" rx="4" fill="#8a8a9a"/>
  <rect x="78" y="52" width="18" height="12" rx="4" fill="#8a8a9a"/>
