  <ellipse cx="60" cy="35" rx="20" ry="22" fill="#d4a843"/>
  <!-- Helmet -->
  <path d="M38 30 Q40 8 60 5 Q80 8 82 30 L80 38 Q70 30 50 30 L38 30 Z" fill="#8a8a9a"/>
  <!-- Face guard -->
  <rect x="44" y="32" width="32" height="15" rx="3" fill="#8a8a9a"/>
  <rect x="48" y="35" width="10" height="5" rx="1" fill="#2a2a3a"/>
  <rect x="62" y="35" width="10" height="5" rx="1" fill="#2a2a3a"/>
  <!-- Crest -->
  <path d="M55 5 Q58 -8 60 -8 Q62 -8 65 5" fill="#aa2a2a"/>
