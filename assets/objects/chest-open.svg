<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80"
  data-asset-id="chest-open" data-layer="object"
  data-tags="chest,open,treasure,宝箱,打开,loot,container"
  data-origin="center-bottom">
  <!-- Chest body -->
  <rect x="10" y="40" width="60" height="28" rx="3" fill="#8b6914" stroke="#6b4914" stroke-width="1.5"/>
  <!-- Inner (visible because open) -->
  <rect x="12" y="42" width="56" height="24" rx="2" fill="#3a2a08"/>
  <!-- Gold inside -->
  <circle cx="30" cy="52" r="4" fill="#ffd700"/>
  <circle cx="40" cy="50" r="5" fill="#ffd700"/>
  <circle cx="50" cy="53" r="4" fill="#ffd700"/>
  <circle cx="35" cy="56" r="3" fill="#ffd700"/>
  <circle cx="45" cy="55" r="3" fill="#ffd700"/>
  <!-- Gem inside -->
  <polygon points="42,48 45,44 48,48 45,50" fill="#3366cc"/>
  <!-- Lid (open, tilted back) -->
  <path d="M10,40 Q10,25 40,20 Q70,25 70,40" fill="#9a7a14" stroke="#6b4914" stroke-width="1.5"/>
  <!-- Lid band -->
  <path d="M12,38 Q12,28 40,23 Q68,28 68,38" fill="none" stroke="#6b4914" stroke-width="2"/>
  <!-- Lock -->
  <rect x="36" y="38" width="8" height="6" rx="1" fill="#ffd700"/>
  <!-- Glow from gold -->
  <circle cx="40" cy="50" r="15" fill="#ffd700" opacity="0.1"/>
</svg>