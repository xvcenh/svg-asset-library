<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80"
  data-asset-id="barrel" data-layer="object"
  data-tags="barrel,cask,container,木桶,酒桶,storage"
  data-origin="center-bottom">
  <!-- Barrel body -->
  <path d="M20,20 Q15,20 15,30 L15,55 Q15,65 20,65 L60,65 Q65,65 65,55 L65,30 Q65,20 60,20Z" fill="#8b6914"/>
  <!-- Barrel bands -->
  <rect x="15" y="25" width="50" height="3" rx="1" fill="#6b4914"/>
  <rect x="15" y="42" width="50" height="3" rx="1" fill="#6b4914"/>
  <rect x="15" y="58" width="50" height="3" rx="1" fill="#6b4914"/>
  <!-- Wood grain -->
  <g stroke="#7a5a0a" stroke-width="0.5" opacity="0.3">
    <line x1="25" y1="20" x2="25" y2="65"/>
    <line x1="35" y1="20" x2="35" y2="65"/>
    <line x1="45" y1="20" x2="45" y2="65"/>
    <line x1="55" y1="20" x2="55" y2="65"/>
  </g>
  <!-- Top -->
  <ellipse cx="40" cy="20" rx="25" ry="6" fill="#9a7a14" stroke="#6b4914" stroke-width="1"/>
  <!-- Top band -->
  <ellipse cx="40" cy="20" rx="22" ry="4" fill="none" stroke="#6b4914" stroke-width="1.5"/>
</svg>