<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160"
  data-asset-id="skeleton" data-layer="creature"
  data-tags="skeleton,undead,骷髅,亡灵,bones,undead,monster"
  data-origin="center-bottom">
  <!-- Skull -->
  <ellipse cx="60" cy="28" rx="18" ry="20" fill="#e0d8c8"/>
  <ellipse cx="60" cy="32" rx="14" ry="12" fill="#d0c8b8"/>
  <!-- Eye sockets -->
  <ellipse cx="53" cy="26" rx="5" ry="6" fill="#1a1a1a"/>
  <ellipse cx="67" cy="26" rx="5" ry="6" fill="#1a1a1a"/>
  <!-- Eye glow -->
  <circle cx="53" cy="26" r="2" fill="#cc3333" opacity="0.8">
    <animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="0.8;0.3;0.8"/>
  </circle>
  <circle cx="67" cy="26" r="2" fill="#cc3333" opacity="0.8">
    <animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="0.8;0.3;0.8"/>
  </circle>
  <!-- Nose hole -->
  <polygon points="58,32 62,32 60,36" fill="#1a1a1a"/>
  <!-- Jaw -->
  <path d="M48,38 Q60,44 72,38" fill="none" stroke="#d0c8b8" stroke-width="3"/>
  <!-- Teeth -->
  <g fill="#e0d8c8">
    <rect x="50" y="37" width="3" height="4" rx="1"/>
    <rect x="55" y="37" width="3" height="4" rx="1"/>
    <rect x="62" y="37" width="3" height="4" rx="1"/>
    <rect x="67" y="37" width="3" height="4" rx="1"/>
  </g>
  <!-- Spine -->
  <rect x="58" y="48" width="4" height="35" rx="1" fill="#d0c8b8"/>
  <!-- Ribs -->
  <g fill="none" stroke="#d0c8b8" stroke-width="2">
    <path d="M48,58 Q60,55 72,58"/>
    <path d="M46,64 Q60,61 74,64"/>
    <path d="M48,70 Q60,67 72,70"/>
    <path d="M50,76 Q60,73 70,76"/>
  </g>
  <!-- Pelvis -->
  <path d="M48,83 Q60,88 72,83" fill="#d0c8b8"/>
  <!-- Arms -->
  <line x1="48" y1="55" x2="30" y2="80" stroke="#d0c8b8" stroke-width="3"/>
  <line x1="72" y1="55" x2="90" y2="80" stroke="#d0c8b8" stroke-width="3"/>
  <!-- Hands -->
  <g fill="#d0c8b8">
    <circle cx="28" cy="82" r="3"/>
    <circle cx="92" cy="82" r="3"/>
  </g>
  <!-- Legs -->
  <line x1="52" y1="85" x2="45" y2="130" stroke="#d0c8b8" stroke-width="3"/>
  <line x1="68" y1="85" x2="75" y2="130" stroke="#d0c8b8" stroke-width="3"/>
  <!-- Feet -->
  <rect x="40" y="130" width="12" height="4" rx="2" fill="#d0c8b8"/>
  <rect x="70" y="130" width="12" height="4" rx="2" fill="#d0c8b8"/>
</svg>