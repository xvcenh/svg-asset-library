<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160"
  data-asset-id="dragon" data-layer="creature"
  data-tags="dragon,drake,wyrm,龙,火龙,boss,monster,reptile"
  data-origin="center-bottom">
  <defs>
    <linearGradient id="dg-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a2a1a"/>
      <stop offset="100%" stop-color="#3a1a0a"/>
    </linearGradient>
    <linearGradient id="dg-wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a2010" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3a1508" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <!-- Tail -->
  <path d="M30,130 Q10,120 5,100 Q2,85 10,75" fill="none" stroke="#4a2010" stroke-width="6" stroke-linecap="round"/>
  <polygon points="5,100 0,90 12,95" fill="#cc3333"/>
  <!-- Body -->
  <ellipse cx="80" cy="105" rx="40" ry="30" fill="url(#dg-body)"/>
  <!-- Belly scales -->
  <ellipse cx="80" cy="112" rx="25" ry="15" fill="#7a4a2a" opacity="0.5"/>
  <!-- Legs -->
  <rect x="55" y="125" width="12" height="25" rx="4" fill="#4a2010"/>
  <rect x="93" y="125" width="12" height="25" rx="4" fill="#4a2010"/>
  <!-- Claws -->
  <polygon points="55,150 52,155 58,155" fill="#ffd700"/>
  <polygon points="60,150 57,155 63,155" fill="#ffd700"/>
  <polygon points="93,150 90,155 96,155" fill="#ffd700"/>
  <polygon points="98,150 95,155 101,155" fill="#ffd700"/>
  <!-- Left wing -->
  <path d="M55,80 Q20,50 10,30 Q15,45 25,55 Q15,50 5,40 Q12,55 20,65 L55,90Z" fill="url(#dg-wing)" stroke="#3a1508" stroke-width="1"/>
  <!-- Right wing -->
  <path d="M105,80 Q140,50 150,30 Q145,45 135,55 Q145,50 155,40 Q148,55 140,65 L105,90Z" fill="url(#dg-wing)" stroke="#3a1508" stroke-width="1"/>
  <!-- Neck -->
  <path d="M70,80 Q65,60 70,45" fill="none" stroke="#5a2a1a" stroke-width="16" stroke-linecap="round"/>
  <!-- Head -->
  <ellipse cx="70" cy="38" rx="18" ry="14" fill="#5a2a1a"/>
  <!-- Snout -->
  <ellipse cx="58" cy="40" rx="10" ry="8" fill="#4a2010"/>
  <!-- Nostrils -->
  <circle cx="52" cy="38" r="2" fill="#1a0a00"/>
  <circle cx="52" cy="42" r="2" fill="#1a0a00"/>
  <!-- Eye -->
  <ellipse cx="68" cy="34" rx="5" ry="4" fill="#ffd700"/>
  <ellipse cx="68" cy="34" rx="2" ry="4" fill="#1a0a00"/>
  <!-- Horns -->
  <polygon points="62,25 58,10 66,22" fill="#ffd700"/>
  <polygon points="78,28 82,14 75,25" fill="#ffd700"/>
  <!-- Spines along back -->
  <polygon points="75,78 72,68 78,68" fill="#cc3333"/>
  <polygon points="85,82 82,72 88,72" fill="#cc3333"/>
  <polygon points="95,88 92,78 98,78" fill="#cc3333"/>
  <!-- Fire breath -->
  <path d="M48,38 Q35,35 25,38 Q30,32 20,30 Q28,28 18,25" fill="none" stroke="#ff6600" stroke-width="2" opacity="0.6">
    <animate attributeName="opacity" dur="0.5s" repeatCount="indefinite" values="0.6;0.2;0.6"/>
  </path>
</svg>