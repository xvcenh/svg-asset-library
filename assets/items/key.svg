<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60"
  data-asset-id="key" data-layer="item"
  data-tags="key,lock,unlock,钥匙,开锁,treasure"
  data-origin="center-bottom">
  <!-- Key ring -->
  <circle cx="20" cy="20" r="10" fill="none" stroke="#ffd700" stroke-width="3"/>
  <circle cx="20" cy="20" r="6" fill="none" stroke="#cc9900" stroke-width="1"/>
  <!-- Key shaft -->
  <rect x="28" y="18" width="25" height="4" rx="1" fill="#ffd700"/>
  <!-- Key teeth -->
  <rect x="48" y="18" width="3" height="8" rx="1" fill="#ffd700"/>
  <rect x="44" y="18" width="3" height="6" rx="1" fill="#ffd700"/>
  <rect x="40" y="18" width="3" height="4" rx="1" fill="#ffd700"/>
  <!-- Highlight -->
  <rect x="30" y="19" width="15" height="1" fill="rgba(255,255,255,0.3)"/>
</svg>