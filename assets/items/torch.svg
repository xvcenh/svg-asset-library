<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60"
  data-asset-id="torch-item" data-layer="item"
  data-tags="torch,fire,light,火把,照明,flame"
  data-origin="center-bottom">
  <!-- Handle -->
  <rect x="27" y="30" width="6" height="28" rx="2" fill="#6b4a20"/>
  <!-- Torch head wrap -->
  <rect x="24" y="28" width="12" height="6" rx="1" fill="#5a3a10"/>
  <!-- Flame outer -->
  <path d="M30,28 Q22,20 25,12 Q28,5 30,2 Q32,5 35,12 Q38,20 30,28" fill="#ff6600" opacity="0.8">
    <animate attributeName="d" dur="0.5s" repeatCount="indefinite"
      values="M30,28 Q22,20 25,12 Q28,5 30,2 Q32,5 35,12 Q38,20 30,28;
              M30,28 Q21,18 24,10 Q27,3 30,0 Q33,3 36,10 Q39,18 30,28;
              M30,28 Q22,20 25,12 Q28,5 30,2 Q32,5 35,12 Q38,20 30,28"/>
  </path>
  <!-- Flame inner -->
  <path d="M30,26 Q26,20 28,14 Q29,10 30,8 Q31,10 32,14 Q34,20 30,26" fill="#ffcc00">
    <animate attributeName="d" dur="0.4s" repeatCount="indefinite"
      values="M30,26 Q26,20 28,14 Q29,10 30,8 Q31,10 32,14 Q34,20 30,26;
              M30,26 Q25,18 27,12 Q28,8 30,6 Q32,8 33,12 Q35,18 30,26;
              M30,26 Q26,20 28,14 Q29,10 30,8 Q31,10 32,14 Q34,20 30,26"/>
  </path>
  <!-- Glow -->
  <circle cx="30" cy="15" r="12" fill="#ff8800" opacity="0.15">
    <animate attributeName="r" dur="1s" repeatCount="indefinite" values="12;14;12"/>
  </circle>
</svg>