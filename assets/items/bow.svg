<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60"
  data-asset-id="bow" data-layer="item"
  data-tags="bow,arrow,ranged,弓,箭,weapon,hunter"
  data-origin="center-bottom">
  <!-- Bow body -->
  <path d="M15,10 Q5,30 15,50" fill="none" stroke="#8b6914" stroke-width="3" stroke-linecap="round"/>
  <!-- Bow string -->
  <line x1="15" y1="10" x2="15" y2="50" stroke="#ccc" stroke-width="1"/>
  <!-- Arrow -->
  <line x1="15" y1="30" x2="55" y2="30" stroke="#8b6914" stroke-width="2"/>
  <!-- Arrowhead -->
  <polygon points="55,30 48,26 48,34" fill="#8a8a8a"/>
  <!-- Fletching -->
  <polygon points="18,27 12,30 18,33" fill="#cc3333"/>
  <polygon points="22,28 16,30 22,32" fill="#cc3333" opacity="0.7"/>
</svg>