<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60"
  data-asset-id="crown" data-layer="item"
  data-tags="crown,king,royalty,皇冠,王冠,throne,gold"
  data-origin="center-bottom">
  <!-- Crown base -->
  <rect x="10" y="35" width="40" height="12" rx="2" fill="#ffd700"/>
  <!-- Crown points -->
  <polygon points="10,35 15,15 20,35" fill="#ffd700"/>
  <polygon points="20,35 30,8 40,35" fill="#ffd700"/>
  <polygon points="40,35 45,15 50,35" fill="#ffd700"/>
  <!-- Gems -->
  <circle cx="15" cy="25" r="3" fill="#cc3333"/>
  <circle cx="30" cy="20" r="4" fill="#3366cc"/>
  <circle cx="45" cy="25" r="3" fill="#33cc33"/>
  <!-- Base gems -->
  <circle cx="20" cy="41" r="2" fill="#cc3333"/>
  <circle cx="30" cy="41" r="2" fill="#ffd700" stroke="#cc9900" stroke-width="0.5"/>
  <circle cx="40" cy="41" r="2" fill="#3366cc"/>
  <!-- Inner band -->
  <rect x="12" y="37" width="36" height="2" fill="#cc9900" opacity="0.5"/>
</svg>